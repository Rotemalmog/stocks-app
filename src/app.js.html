<script>
/* ------------------------------------------------------------------
 * Front-end. One RPC (getDashboardData) renders everything; each
 * mutation returns fresh dashboard data so we never round-trip twice.
 * ------------------------------------------------------------------ */

var state = { data: null, list: 'watchlist', busy: false };
var charts = { positions: null, themes: null };

var MAX_SLICES = 6;
var strategyPrimed = false;   // part-to-whole reads at a glance only up to ~6 segments

/** Promise wrapper around the callback-based google.script.run. */
function rpc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); })
      [fn].apply(null, args);
  });
}

function $(id) { return document.getElementById(id); }

function seriesColors() {
  var cs = getComputedStyle(document.documentElement);
  var out = [];
  for (var i = 1; i <= 8; i++) out.push(cs.getPropertyValue('--s' + i).trim());
  return out;
}
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ---------------- formatting ---------------- */

function ccySymbol(c) { return c === 'ILS' ? '₪' : '$'; }

function money(v, c) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  var abs = Math.abs(v);
  var digits = abs < 100 ? 2 : 0;
  return (v < 0 ? '-' : '') + ccySymbol(c) +
    abs.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function signedMoney(v, c) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v > 0 ? '+' : '') + money(v, c);
}
function pct(v, digits) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v * 100).toFixed(digits === undefined ? 1 : digits) + '%';
}
function signedPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (v > 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
}
function compact(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  var units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  for (var i = 0; i < units.length; i++) {
    if (Math.abs(v) >= units[i][0]) return '$' + (v / units[i][0]).toFixed(2) + units[i][1];
  }
  return '$' + v.toFixed(0);
}
function dirClass(v) {
  if (v === null || v === undefined || isNaN(v) || v === 0) return '';
  return v > 0 ? 'up' : 'down';
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ---------------- load & render ---------------- */

function setBusy(b) {
  state.busy = b;
  $('btnRefresh').disabled = b;
  $('btnAdd').disabled = b;
  if (b) $('stamp').textContent = 'refreshing…';
}

function load() {
  setBusy(true);
  return rpc('getDashboardData')
    .then(render)
    .catch(function (e) {
      $('notices').innerHTML = notice('danger', 'Could not load: ' + esc(e.message) +
        ' — if this is the first run, open the Apps Script editor and run setup().');
      $('stamp').textContent = 'error';
    })
    .then(function () { setBusy(false); });
}

function render(data) {
  state.data = data;
  var c = data.settings.displayCurrency;

  $('stamp').textContent = data.fetchedAt + '  ·  ' + (data.elapsedMs / 1000).toFixed(1) + 's' +
    (data.usdIls ? '  ·  USD/ILS ' + data.usdIls.toFixed(3) : '');

  $('heroValue').textContent = money(data.totals.marketValue, c);
  $('heroCost').textContent = money(data.totals.costBasis, c);

  var realised = $('heroRealised');
  var hasRealised = isFinite(data.realisedTotal) && data.realisedTotal !== 0;
  $('heroRealisedWrap').classList.toggle('hidden', !hasRealised);
  if (hasRealised) {
    realised.textContent = signedMoney(data.realisedTotal, 'USD');
    realised.className = 'stat-value ' + dirClass(data.realisedTotal);
  }

  var pnl = $('heroPnl');
  pnl.textContent = signedMoney(data.totals.pnl, c) + '  (' + signedPct(data.totals.pnlPct) + ')';
  pnl.className = 'stat-value ' + dirClass(data.totals.pnl);

  var day = $('heroDay');
  day.textContent = signedMoney(data.totals.dayChange, c) + '  (' + signedPct(data.totals.dayChangePct) + ')';
  day.className = 'stat-value ' + dirClass(data.totals.dayChange);

  $('ccyUSD').setAttribute('aria-pressed', String(c === 'USD'));
  $('ccyILS').setAttribute('aria-pressed', String(c === 'ILS'));

  renderNotices(data.analytics.warnings);
  renderPositions(data, c);
  renderCharts(data, c);
  renderWatchlist(data, c);
  renderRisk(data);
  renderTrades(data, c);
}

function notice(level, html) {
  var ico = level === 'danger' ? '!' : (level === 'warn' ? '!' : 'i');
  return '<div class="notice ' + level + '"><span class="ico">' + ico + '</span><span>' + html + '</span></div>';
}

function renderNotices(warnings) {
  var list = warnings || [];
  // Alerts live at the foot of the page, so the section (and its heading)
  // is hidden entirely when there is nothing to say.
  $('alerts').classList.toggle('hidden', list.length === 0);
  $('notices').innerHTML = list.map(function (w) {
    return notice(w.level, esc(w.text));
  }).join('');
}

function renderPositions(data, c) {
  var rows = data.positions;
  $('pfCount').textContent = rows.length
    ? rows.length + ' position' + (rows.length === 1 ? '' : 's')
    : '';
  $('pfEmpty').classList.toggle('hidden', rows.length > 0);

  $('pfBody').innerHTML = rows.map(function (r) {
    return '<tr>' +
      '<td><span class="tk">' + esc(r.ticker) + '</span>' +
        (r.stale ? ' <span class="pill stale">stale</span>' : '') +
        '<div class="co">' + esc(r.name) + '</div></td>' +
      '<td>' + r.shares.toLocaleString('en-US') + '</td>' +
      '<td>' + money(r.avgCost, r.costCurrency) + '</td>' +
      '<td>' + (r.price === null ? '—' : money(r.price, 'USD')) + '</td>' +
      '<td class="' + dirClass(r.changePct) + '">' + signedPct(r.changePct) + '</td>' +
      '<td>' + money(r.marketValue, c) + '</td>' +
      '<td class="' + dirClass(r.pnl) + '">' + signedMoney(r.pnl, c) + '</td>' +
      '<td class="' + dirClass(r.pnlPct) + '">' + signedPct(r.pnlPct) + '</td>' +
      '<td>' + pct(r.weight) + '</td>' +
      '<td><span class="pill">' + esc(r.riskTag) + '</span>' +
        (r.mixedCurrency ? ' <span class="pill over">mixed ccy</span>' : '') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button data-trade="BUY"  data-ticker="' + esc(r.ticker) + '">Buy</button> ' +
        '<button data-trade="SELL" data-ticker="' + esc(r.ticker) + '">Sell</button> ' +
        '<button class="btn-danger" data-remove="positions" data-ticker="' + esc(r.ticker) + '">Delete</button>' +
      '</td>' +
      '</tr>';
  }).join('');
}

/** Collapse a weighted list to at most MAX_SLICES entries plus "Other". */
function topSlices(items) {
  // Zero-weight entries (a position with no live price) would render as an
  // empty 0% slice, so they are dropped from the chart but stay in the table.
  var sorted = items.slice()
    .filter(function (x) { return x.weight > 0; })
    .sort(function (a, b) { return b.weight - a.weight; });
  if (sorted.length <= MAX_SLICES) return sorted;
  var head = sorted.slice(0, MAX_SLICES - 1);
  var tail = sorted.slice(MAX_SLICES - 1);
  head.push({
    key: 'Other (' + tail.length + ')',
    weight: tail.reduce(function (a, x) { return a + x.weight; }, 0)
  });
  return head;
}

function drawPie(canvasId, legendId, items, c) {
  var slices = topSlices(items);
  var colors = seriesColors();
  var surface = cssVar('--surface');
  var total = state.data.totals.marketValue;

  var cfg = {
    type: 'doughnut',
    data: {
      labels: slices.map(function (s) { return s.key; }),
      datasets: [{
        data: slices.map(function (s) { return +(s.weight * 100).toFixed(2); }),
        backgroundColor: slices.map(function (_, i) { return colors[i % colors.length]; }),
        borderColor: surface,
        borderWidth: 2,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '58%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              var w = ctx.parsed / 100;
              return ' ' + ctx.label + '  ' + pct(w) +
                (total ? '  ·  ' + money(total * w, c) : '');
            }
          }
        }
      }
    }
  };

  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart($(canvasId).getContext('2d'), cfg);

  // The legend doubles as the direct-label layer: identity never rests on colour alone.
  $(legendId).innerHTML = slices.map(function (s, i) {
    return '<li>' +
      '<span class="swatch" style="background:' + colors[i % colors.length] + '"></span>' +
      '<span class="name">' + esc(s.key) + '</span>' +
      '<span class="val">' + pct(s.weight) +
        (total ? '  ·  ' + money(total * s.weight, c) : '') + '</span>' +
      '</li>';
  }).join('');
}

function renderCharts(data, c) {
  if (!data.positions.length) {
    ['piePositions', 'pieThemes'].forEach(function (id) {
      if (charts[id]) { charts[id].destroy(); charts[id] = null; }
    });
    $('legendPositions').innerHTML = '';
    $('legendThemes').innerHTML = '';
    return;
  }
  drawPie('piePositions', 'legendPositions',
    data.positions.map(function (r) { return { key: r.ticker, weight: r.weight }; }), c);
  drawPie('pieThemes', 'legendThemes', data.analytics.themes, c);
}

function renderWatchlist(data, c) {
  var rows = data.watchlist;
  $('wlEmpty').classList.toggle('hidden', rows.length > 0);

  $('wlBody').innerHTML = rows.map(function (w) {
    var band = w.range52 === null ? '—'
      : pct(w.range52, 0) + ' of 52w range';
    return '<tr>' +
      '<td><span class="tk">' + esc(w.ticker) + '</span>' +
        (w.stale ? ' <span class="pill stale">stale</span>' : '') +
        '<div class="co">' + esc(w.name) + '</div></td>' +
      '<td>' + (w.price === null ? '—' : money(w.priceDisplay, c)) + '</td>' +
      '<td class="' + dirClass(w.changePct) + '">' + signedPct(w.changePct) + '</td>' +
      '<td>' + band + '</td>' +
      '<td>' + (w.targetEntry ? money(w.targetEntry, 'USD') : '—') + '</td>' +
      '<td class="' + (w.toTarget === null ? '' : (w.toTarget <= 0 ? 'up' : '')) + '">' +
        (w.toTarget === null ? '—' : signedPct(w.toTarget)) + '</td>' +
      '<td>' + (w.pe === null ? '—' : w.pe.toFixed(1)) + '</td>' +
      '<td><span class="pill">' + esc(w.theme) + '</span></td>' +
      '<td><button class="btn-danger" data-remove="watchlist" data-ticker="' + esc(w.ticker) + '">Remove</button></td>' +
      '</tr>';
  }).join('');
}

function renderRisk(data) {
  var a = data.analytics;
  var cc = a.concentration;

  $('concBody').innerHTML = [
    ['Positions', cc.positionCount],
    ['Largest position', pct(cc.topWeight)],
    ['Top 3 combined', pct(cc.top3Weight)],
    ['Herfindahl index', cc.hhi.toFixed(3)],
    ['Behaves like', cc.effectiveHoldings.toFixed(1) + ' equal positions']
  ].map(function (r) {
    return '<tr><td style="text-align:left;color:var(--text-secondary)">' + r[0] +
           '</td><td>' + r[1] + '</td></tr>';
  }).join('');

  var d = a.drawdown;
  var ratio = d.tolerance > 0 ? Math.min(d.modelledDrawdown / d.tolerance, 1) : 0;
  $('ddSub').textContent = 'Each position modelled at a pessimistic single-name loss, weighted by size.';
  $('ddMeter').className = 'meter' + (d.withinTolerance ? '' : ' over');
  $('ddMeter').firstElementChild.style.width = (ratio * 100).toFixed(1) + '%';
  $('ddText').innerHTML = '<strong>' + pct(d.modelledDrawdown) + '</strong> modelled vs ' +
    pct(d.tolerance) + ' tolerance — ' +
    (d.withinTolerance
      ? '<span class="up">within tolerance</span>'
      : '<span class="down">beyond tolerance</span>');

  $('ddBody').innerHTML = d.contributions.map(function (x) {
    return '<tr><td><span class="tk">' + esc(x.ticker) + '</span></td>' +
      '<td>' + pct(x.weight) + '</td>' +
      '<td>' + pct(x.assumedDrawdown, 0) + '</td>' +
      '<td>' + pct(x.contribution) + '</td></tr>';
  }).join('');

  $('twBody').innerHTML = a.taiwan.map(function (b) {
    return '<tr><td style="text-align:left">' + esc(b.label) +
      '<div class="co">' + esc(b.tickers.join(', ')) + '</div></td>' +
      '<td>' + pct(b.weight) + '</td></tr>';
  }).join('') || '<tr><td class="co">No positions.</td></tr>';

  $('bandBody').innerHTML = a.bands.map(function (b) {
    var label = b.status === 'over' ? 'over band' : (b.status === 'under' ? 'under band' : 'in band');
    return '<tr><td><span class="tk">' + esc(b.ticker) + '</span></td>' +
      '<td><span class="pill">' + esc(b.riskTag) + '</span></td>' +
      '<td>' + pct(b.weight) + '</td>' +
      '<td>' + pct(b.bandMin, 0) + '–' + pct(b.bandMax, 0) + '</td>' +
      '<td><span class="pill' + (b.trimSuggested ? ' over' : '') + '">' + label +
        (b.trimSuggested ? ' · trim' : '') + '</span></td></tr>';
  }).join('') || '<tr><td class="co">No positions.</td></tr>';
}

/* ---------------- modal ---------------- */

function openModal() {
  $('fTicker').value = '';
  $('fShares').value = '';
  $('fCost').value = '';
  $('fNotes').value = '';
  $('fTarget').value = '';
  $('fThesis').value = '';
  $('modalMsg').innerHTML = '';
  setList('watchlist');
  $('overlay').classList.remove('hidden');
  $('fTicker').focus();
}
function closeModal() { $('overlay').classList.add('hidden'); }

function setList(which) {
  state.list = which;
  $('listWatch').setAttribute('aria-pressed', String(which === 'watchlist'));
  $('listPos').setAttribute('aria-pressed', String(which === 'positions'));
  $('posFields').classList.toggle('hidden', which !== 'positions');
  $('watchFields').classList.toggle('hidden', which !== 'watchlist');
  $('btnSave').textContent = which === 'positions' ? 'Add position' : 'Add to watchlist';
}

function save(force) {
  var payload = {
    list: state.list,
    ticker: $('fTicker').value,
    force: !!force
  };
  if (state.list === 'positions') {
    payload.shares = $('fShares').value;
    payload.avgCost = $('fCost').value;
    payload.costCurrency = $('fCcy').value;
    payload.riskTag = $('fTag').value;
    payload.notes = $('fNotes').value;
  } else {
    payload.targetEntry = $('fTarget').value;
    payload.thesis = $('fThesis').value;
  }

  $('btnSave').disabled = true;
  $('modalMsg').innerHTML = '<div class="msg">Checking…</div>';

  rpc('addHolding', payload)
    .then(function (data) {
      closeModal();
      render(data);
    })
    .catch(function (e) {
      var msg = e.message || String(e);
      // Coverage is genuinely unreliable for recent listings, so offer to add anyway
      // rather than pretending the ticker does not exist.
      var recoverable = /no price for|does not look like/i.test(msg) && !force;
      $('modalMsg').innerHTML =
        '<div class="msg err">' + esc(msg) + '</div>' +
        (recoverable
          ? '<button id="btnForce">Add it anyway (no live price)</button>'
          : '');
      if (recoverable) $('btnForce').addEventListener('click', function () { save(true); });
    })
    .then(function () { $('btnSave').disabled = false; });
}

/* ---------------- strategy screen ---------------- */

function scoreClass(v) {
  if (v === null || v === undefined) return '';
  if (v >= 70) return 'up';
  if (v < 45) return 'down';
  return '';
}
function fmtScore(v) {
  return (v === null || v === undefined) ? '—' : Math.round(v);
}

function loadStrategy() {
  var btn = $('btnScore');
  btn.disabled = true;
  btn.textContent = 'Scoring… (about a second per ticker)';
  $('stStamp').textContent = '';

  rpc('getStrategyData')
    .then(renderStrategy)
    .catch(function (e) {
      $('stBody').innerHTML = '';
      $('stDetail').innerHTML = notice('danger', 'Screen failed: ' + esc(e.message));
    })
    .then(function () {
      btn.disabled = false;
      btn.textContent = 'Run the screen';
    });
}

function renderStrategy(d) {
  $('stNeedsKey').classList.toggle('hidden', !d.needsKey);
  $('stEmpty').classList.toggle('hidden', !d.empty);
  $('stContent').classList.toggle('hidden', d.empty || d.needsKey);
  if (d.empty || d.needsKey) return;

  $('stStamp').textContent = d.fetchedAt
    ? d.fetchedAt + '  ·  ' + (d.elapsedMs / 1000).toFixed(1) + 's'
    : '';

  $('stBody').innerHTML = d.rows.map(function (r) {
    var cov = Math.round(r.coverage * 100);
    return '<tr>' +
      '<td><span class="tk">' + esc(r.ticker) + '</span>' +
        (r.fetchError ? ' <span class="pill stale">' + esc(r.fetchError) + '</span>' : '') + '</td>' +
      '<td class="' + scoreClass(r.total) + '" style="font-weight:600">' + fmtScore(r.total) + '</td>' +
      '<td class="' + scoreClass(r.pillars.quality) + '">' + fmtScore(r.pillars.quality) + '</td>' +
      '<td class="' + scoreClass(r.pillars.strength) + '">' + fmtScore(r.pillars.strength) + '</td>' +
      '<td class="' + scoreClass(r.pillars.growth) + '">' + fmtScore(r.pillars.growth) + '</td>' +
      '<td class="' + scoreClass(r.pillars.valuation) + '">' + fmtScore(r.pillars.valuation) + '</td>' +
      '<td class="' + scoreClass(r.pillars.resilience) + '">' + fmtScore(r.pillars.resilience) + '</td>' +
      '<td>' + (r.lowConfidence
          ? '<span class="pill over">' + cov + '% low</span>'
          : cov + '%') + '</td>' +
      '<td>' + (r.held ? '<span class="pill">held</span>' : '') + '</td>' +
      '</tr>';
  }).join('');

  // Per-stock detail: every raw number beside the score it produced, so no
  // composite is ever shown without the inputs that made it.
  $('stDetail').innerHTML = d.rows.map(function (r) {
    var flags = (r.flags || []).map(function (f) {
      return notice(f.level, esc(f.text));
    }).join('');

    var rowsHtml = r.details.map(function (m) {
      var raw = (m.raw === null || m.raw === undefined) ? '—'
        : (typeof m.raw === 'number' ? (Math.round(m.raw * 100) / 100) : esc(m.raw));
      return '<tr><td style="text-align:left">' + esc(m.label) +
        '<div class="co">' + esc(m.pillar) + '</div></td>' +
        '<td>' + raw + '</td>' +
        '<td class="' + scoreClass(m.score) + '">' + fmtScore(m.score) + '</td></tr>';
    }).join('');

    return '<details style="margin-top:14px">' +
      '<summary style="cursor:pointer;padding:8px 0;font-weight:600">' +
        esc(r.ticker) + ' — score ' + fmtScore(r.total) +
        (r.lowConfidence ? ' (low confidence: ' + r.metricsAvailable + ' of ' +
                           r.metricsTotal + ' metrics)' : '') +
      '</summary>' +
      flags +
      '<table style="margin-top:8px"><thead><tr>' +
        '<th>Metric</th><th>Value</th><th>Score</th>' +
      '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
      '</details>';
  }).join('');
}

/* ---------------- trades ---------------- */

function renderTrades(data, c) {
  var txs = data.transactions || [];
  $('txEmpty').classList.toggle('hidden', txs.length > 0);

  $('txBody').innerHTML = txs.map(function (t) {
    return '<tr>' +
      '<td style="text-align:left">' + esc(t.date) + '</td>' +
      '<td><span class="tk">' + esc(t.ticker) + '</span></td>' +
      '<td><span class="pill' + (t.type === 'SELL' ? ' over' : '') + '">' + esc(t.type) + '</span></td>' +
      '<td>' + t.shares.toLocaleString('en-US') + '</td>' +
      '<td>' + money(t.price, t.currency) + '</td>' +
      '<td>' + (t.fees ? money(t.fees, t.currency) : '—') + '</td>' +
      '<td>' + money(t.shares * t.price, t.currency) + '</td>' +
      '<td style="text-align:left" class="co">' + esc(t.notes) + '</td>' +
      '</tr>';
  }).join('');

  var closed = data.closedPositions || [];
  $('closedEmpty').classList.toggle('hidden', closed.length > 0);
  $('closedBody').innerHTML = closed.map(function (p) {
    return '<tr>' +
      '<td><span class="tk">' + esc(p.ticker) + '</span></td>' +
      '<td>' + esc(p.closedOn) + '</td>' +
      '<td>' + p.txCount + '</td>' +
      '<td class="' + dirClass(p.realised) + '">' + signedMoney(p.realised, 'USD') + '</td>' +
      '</tr>';
  }).join('');
}

/* ---------------- buy / sell modal ---------------- */

var txState = { ticker: '', type: 'BUY' };

function openTrade(ticker, type) {
  var held = (state.data.positions || []).filter(function (p) {
    return p.ticker === ticker;
  })[0];

  txState.ticker = ticker;
  $('txTitle').textContent = 'Record a trade — ' + ticker;
  $('txHolding').textContent = held
    ? 'You hold ' + held.shares + ' at an average cost of ' + money(held.avgCost, held.costCurrency)
    : 'New position.';
  $('txShares').value = '';
  $('txPrice').value = (held && held.price) ? held.price.toFixed(2) : '';
  $('txFees').value = '';
  $('txNotes').value = '';
  $('txCcy').value = held ? held.costCurrency : 'USD';
  $('txDate').value = new Date().toISOString().slice(0, 10);
  $('txMsg').innerHTML = '';
  setTradeType(type || 'BUY');
  $('txOverlay').classList.remove('hidden');
  $('txShares').focus();
}

function closeTrade() { $('txOverlay').classList.add('hidden'); }

function setTradeType(type) {
  txState.type = type;
  $('txBuy').setAttribute('aria-pressed', String(type === 'BUY'));
  $('txSell').setAttribute('aria-pressed', String(type === 'SELL'));
  $('txSave').textContent = type === 'BUY' ? 'Record buy' : 'Record sell';
}

function saveTrade() {
  $('txSave').disabled = true;
  $('txMsg').innerHTML = '<div class="msg">Saving…</div>';

  rpc('recordTransaction', {
    ticker: txState.ticker,
    type: txState.type,
    shares: $('txShares').value,
    price: $('txPrice').value,
    currency: $('txCcy').value,
    fees: $('txFees').value,
    date: $('txDate').value,
    notes: $('txNotes').value,
    force: true
  })
    .then(function (data) { closeTrade(); render(data); })
    .catch(function (e) {
      $('txMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    })
    .then(function () { $('txSave').disabled = false; });
}

/* ---------------- wiring ---------------- */

document.addEventListener('DOMContentLoaded', function () {
  $('btnAdd').addEventListener('click', openModal);
  $('btnCancel').addEventListener('click', closeModal);
  $('btnSave').addEventListener('click', function () { save(false); });
  $('btnRefresh').addEventListener('click', load);
  $('btnScore').addEventListener('click', loadStrategy);
  $('txCancel').addEventListener('click', closeTrade);
  $('txSave').addEventListener('click', saveTrade);
  $('txBuy').addEventListener('click', function () { setTradeType('BUY'); });
  $('txSell').addEventListener('click', function () { setTradeType('SELL'); });
  $('txOverlay').addEventListener('click', function (e) {
    if (e.target === $('txOverlay')) closeTrade();
  });
  $('listWatch').addEventListener('click', function () { setList('watchlist'); });
  $('listPos').addEventListener('click', function () { setList('positions'); });

  $('overlay').addEventListener('click', function (e) {
    if (e.target === $('overlay')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); closeTrade(); }
    if (e.key === 'Enter' && !$('overlay').classList.contains('hidden') &&
        e.target.tagName !== 'TEXTAREA') save(false);
  });

  ['USD', 'ILS'].forEach(function (c) {
    $('ccy' + c).addEventListener('click', function () {
      if (state.busy || !state.data || state.data.settings.displayCurrency === c) return;
      setBusy(true);
      rpc('updateSetting', 'displayCurrency', c)
        .then(render)
        .catch(function (e) { alert(e.message); })
        .then(function () { setBusy(false); });
    });
  });

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (t) {
        t.setAttribute('aria-selected', String(t === tab));
      });
      ['pf', 'wl', 'rk', 'st', 'tx'].forEach(function (p) {
        $('panel-' + p).classList.toggle('hidden', p !== tab.dataset.panel);
      });
      if (tab.dataset.panel === 'st' && !strategyPrimed) {
        strategyPrimed = true;
        rpc('getStrategyData').then(renderStrategy).catch(function () {});
      }
    });
  });

  document.body.addEventListener('click', function (e) {
    var trade = e.target.closest ? e.target.closest('[data-trade]') : null;
    if (trade) { openTrade(trade.dataset.ticker, trade.dataset.trade); return; }

    var btn = e.target.closest ? e.target.closest('[data-remove]') : null;
    if (!btn) return;
    var list = btn.dataset.remove, ticker = btn.dataset.ticker;
    var msg = list === 'positions'
      ? 'Delete ' + ticker + ' and its ENTIRE trade history? This cannot be undone. ' +
        'To record a sale instead, use Sell.'
      : 'Remove ' + ticker + ' from your watchlist?';
    if (!confirm(msg)) return;
    setBusy(true);
    rpc('removeHolding', list, ticker)
      .then(render)
      .catch(function (err) { alert(err.message); })
      .then(function () { setBusy(false); });
  });

  // Chart colours are read from CSS variables, so re-render when the OS theme flips.
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (state.data) renderCharts(state.data, state.data.settings.displayCurrency);
    });
  }

  load();
});
</script>
