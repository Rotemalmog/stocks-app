<style>
:root {
  color-scheme: light;
  --plane:          #f9f9f7;
  --surface:        #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --up:             #006300;
  --down:           #d03b3b;
  --good:           #0ca30c;
  --warning:        #fab219;
  --serious:        #ec835a;
  --critical:       #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:          #0d0d0d;
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --up:             #0ca30c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:          #0d0d0d;
  --surface:        #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --grid:           #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --up:             #0ca30c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0 16px 64px;
  background: var(--plane);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; }

/* ---------- header ---------- */
header { padding: 20px 0 12px; }
.title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.stamp { color: var(--muted); font-size: 12px; }

.hero { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-end; margin-top: 14px; }
.hero-figure { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.hero-label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.stat { min-width: 108px; }
.stat-value { font-size: 17px; font-weight: 600; }
.up { color: var(--up); }
.down { color: var(--down); }

/* ---------- controls ---------- */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 8px; }
button, select {
  font: inherit; color: var(--text-primary); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--grid); }
button:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--s1); }
.btn-danger { color: var(--critical); border-color: transparent; background: transparent; padding: 4px 8px; }
.btn-danger:hover { background: var(--grid); }
.spacer { flex: 1; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 16px 0 0; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; padding: 9px 14px; color: var(--text-secondary); font-weight: 500;
}
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--s1); }
.tab:hover { background: none; color: var(--text-primary); }

/* ---------- cards & charts ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.chart-box { position: relative; height: 240px; }

.legend { list-style: none; margin: 14px 0 0; padding: 0; }
.legend li {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; font-size: 13px;
}
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .val { font-variant-numeric: tabular-nums; color: var(--text-secondary); }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: right; font-weight: 500; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 0 10px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap;
}
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td {
  text-align: right; padding: 10px; border-bottom: 1px solid var(--grid);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
tbody tr:hover { background: var(--plane); }
.tk { font-weight: 600; }
.co { color: var(--muted); font-size: 12px; font-variant-numeric: normal; }
.pill {
  display: inline-block; padding: 1px 7px; border-radius: 999px;
  font-size: 11px; border: 1px solid var(--border); color: var(--text-secondary);
  font-variant-numeric: normal;
}
.pill.over { color: var(--critical); border-color: var(--critical); }
.pill.stale { color: var(--serious); border-color: var(--serious); }

/* ---------- notices ---------- */
.notice {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--border); border-left-width: 3px;
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  background: var(--surface); font-size: 13px;
}
.notice.danger { border-left-color: var(--critical); }
.notice.warn   { border-left-color: var(--warning); }
.notice.info   { border-left-color: var(--s1); }
.notice .ico { font-weight: 700; flex: none; }
.notice.danger .ico { color: var(--critical); }
.notice.warn .ico   { color: var(--warning); }
.notice.info .ico   { color: var(--s1); }

.meter { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; margin: 8px 0 6px; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--s1); }
.meter.over > span { background: var(--critical); }

.empty { color: var(--muted); text-align: center; padding: 36px 16px; }
.hidden { display: none !important; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: 14px; padding: 20px;
  width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
  border: 1px solid var(--border);
}
.modal h2 { margin: 0 0 16px; font-size: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--baseline); background: var(--plane); color: var(--text-primary);
}
.field textarea { resize: vertical; min-height: 54px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.msg { font-size: 13px; margin: 10px 0; padding: 9px 11px; border-radius: 8px; }
.msg.err { color: var(--critical); background: rgba(208,59,59,0.10); }
.msg.ok  { color: var(--up); background: rgba(12,163,12,0.10); }
.seg { display: flex; gap: 0; border: 1px solid var(--baseline); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; flex: 1; background: var(--plane); }
.seg button[aria-pressed="true"] { background: var(--s1); color: #fff; font-weight: 600; }

.disclaimer {
  margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--grid);
  color: var(--muted); font-size: 12px; line-height: 1.6;
}
@media (max-width: 560px) {
  .hero-figure { font-size: 32px; }
  .hero { gap: 20px; }
  td, th { padding: 8px 6px; }
}
</style>
